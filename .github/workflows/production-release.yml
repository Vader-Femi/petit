name: Production Release

on:
  push:
    branches:
      - production

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: petit-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release

      - name: Compress to ZIP
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath petit-windows.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: petit-windows-zip
          path: petit-windows.zip

  build-linux:
    name: Build Linux App
    runs-on: ubuntu-latest
    # Best effort for now: if this job fails, the other assets are still
    # published (see the `if` on create-release).
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
      # ffmpeg_kit_flutter_new needs libjson-glib; the rest is Flutter's Linux toolchain.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libjson-glib-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build linux --release

      - name: Package tar.gz
        run: |
          cp -r build/linux/x64/release/bundle petit-linux
          tar -czf petit-linux-x64.tar.gz petit-linux

      - name: Package .deb
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          bash packaging/linux/build-deb.sh build/linux/x64/release/bundle "$VERSION" petit-linux-amd64.deb

      - name: Upload Linux assets
        uses: actions/upload-artifact@v4
        with:
          name: petit-linux-assets
          path: |
            petit-linux-x64.tar.gz
            petit-linux-amd64.deb

  build-macos-ios:
    name: Build macOS & iOS Apps
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'
      - run: flutter config --enable-macos-desktop --enable-ios --no-enable-swift-package-manager
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # macOS Build
      - run: flutter build macos --release
      - name: Create macOS ZIP
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/petit.app petit-macos.zip
      - name: Create macOS DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Petit" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 400 185 \
            "petit-macos.dmg" \
            "build/macos/Build/Products/Release/petit.app"

      # iOS Build (Unsigned)
      - run: flutter build ios --release --no-codesign
      - name: Create iOS ZIP
        run: ditto -c -k --keepParent build/ios/iphoneos/Runner.app petit-ios.zip || echo "No app found"

      - name: Upload macOS & iOS Assets
        uses: actions/upload-artifact@v4
        with:
          name: petit-apple-assets
          path: |
            petit-macos.zip
            petit-macos.dmg
            petit-ios.zip

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-macos-ios, build-linux]
    # Linux is best effort for now: publish even if only the Linux build failed.
    # To make it required, add `&& needs.build-linux.result == 'success'`.
    if: ${{ !cancelled() && needs.build-android.result == 'success' && needs.build-windows.result == 'success' && needs.build-macos-ios.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "release-${{ github.sha }}"
          name: "Petit Production Release"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/app-release.apk
            release-assets/petit-windows.zip
            release-assets/petit-macos.zip
            release-assets/petit-macos.dmg
            release-assets/petit-ios.zip
            release-assets/petit-linux-x64.tar.gz
            release-assets/petit-linux-amd64.deb
